 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My Flashcards</h1>
    <p>Click the card to reveal the answer!</p>

    <button id="flashcard" type="button">
      <span id="cardText"></span>
    </button>

    <p id="progress"></p>
    <button id="nextButton" type="button">Next Card →</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
